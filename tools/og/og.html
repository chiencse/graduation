<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
.stage{position:relative;width:1200px;height:630px;overflow:hidden;background:
  radial-gradient(ellipse 60% 50% at 12% 6%,rgba(255,255,255,.6),transparent 70%),
  radial-gradient(ellipse 50% 45% at 92% 18%,rgba(255,246,214,.75),transparent 70%),
  linear-gradient(180deg,#4F97EA 0%,#86BEF3 55%,#CFE6FB 100%)}
.sun{position:absolute;right:120px;top:40px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,#FFFBEA 0 20%,#FFE9B0 34%,rgba(255,226,160,.4) 52%,transparent 70%)}
.cloud{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(255,255,255,.4) 60%,rgba(255,255,255,0));filter:blur(4px)}
.campus{position:absolute;right:-30px;bottom:0;width:720px;height:440px;background:url(bk-campus.jpg) 45% 80%/cover no-repeat;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 32%),linear-gradient(to right,transparent 0%,#000 26%);-webkit-mask-composite:source-in}
.panel{position:absolute;left:70px;top:70px;bottom:70px;width:640px;border-radius:24px;background:rgba(255,255,255,.72);box-shadow:0 30px 60px -30px rgba(11,42,110,.45);
  display:flex;flex-direction:column;justify-content:center;padding:0 44px}
.crest{display:flex;align-items:center;gap:14px;font:600 16px "Be Vietnam Pro",sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#0B2A6E}
.crest img{width:48px;height:auto}
.metal{background:linear-gradient(100deg,#6E5122 0%,#B8914A 22%,#D9B977 34%,#9C7A3C 48%,#6E5122 62%,#B8914A 80%,#D9B977 92%);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{margin:18px 0 0;font:600 98px/0.98 "Cormorant Garamond",serif}
h1 em{display:block;font-style:italic;font-weight:500}
.degree{margin-top:16px;font:italic 500 28px "Cormorant Garamond",serif;color:#22365E}
.when{margin-top:22px;display:inline-flex;align-items:center;gap:16px;font:600 22px "Be Vietnam Pro",sans-serif;color:#fff;background:#0B2A6E;border-radius:999px;padding:12px 24px;align-self:flex-start}
.when i{width:6px;height:6px;border-radius:50%;background:#E9D29A}
.cap{position:absolute;width:44px;color:#B8914A;opacity:.9}
</style></head>
<body><div class="stage">
<div class="sun"></div>
<div class="cloud" style="left:760px;top:70px;width:260px;height:90px"></div>
<div class="cloud" style="left:930px;top:200px;width:200px;height:70px"></div>
<div class="campus"></div>
<svg class="cap" style="left:780px;top:250px;transform:rotate(-18deg)" viewBox="0 0 64 48"><path d="M32 4 2 17l30 13 30-13L32 4Z" fill="currentColor"/><path d="M14 23v11c0 4 8 8 18 8s18-4 18-8V23l-18 8-18-8Z" fill="currentColor" opacity=".78"/></svg>
<svg class="cap" style="left:1080px;top:320px;width:34px;transform:rotate(16deg)" viewBox="0 0 64 48"><path d="M32 4 2 17l30 13 30-13L32 4Z" fill="currentColor"/><path d="M14 23v11c0 4 8 8 18 8s18-4 18-8V23l-18 8-18-8Z" fill="currentColor" opacity=".78"/></svg>
<div class="panel">
  <div class="crest"><img src="bk-logo.png" alt="">Thiệp mời · Lễ tốt nghiệp</div>
  <h1 class="metal">Nông<em class="metal">Minh Chiến</em></h1>
  <div class="degree">Kỹ sư Khoa học Máy tính · ĐH Bách Khoa TP.HCM</div>
  <div class="when"><span>Thứ bảy</span><i></i><span>28 · 11 · 2026</span><i></i><span>15:00</span></div>
</div>
</div></body></html>
